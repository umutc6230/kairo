# Portable Windows surumu derleme, smoke testi ve GitHub Release yayini.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bagimliliklar
        run: pip install -r requirements.txt pyinstaller
      - name: Derle (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller paketleme/kairo.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force `
            paketleme/Baslat.bat, `
            paketleme/BENIOKU.txt, `
            paketleme/Sunucu.bat, `
            paketleme/Sunucu-Durdur.bat, `
            paketleme/Claude-Yerel.bat `
            dist/Kairo/
      - name: Smoke testi
        shell: pwsh
        run: pwsh -File paketleme/smoke.ps1 -Paket dist/Kairo
      - name: Paketle ve SHA256 olustur
        shell: pwsh
        run: |
          $refAd = "${{ github.ref_name }}" -replace '[/\\]', '-'
          $zipAd = "Kairo-$refAd-windows-portable.zip"
          $zipYol = "dist/$zipAd"
          Compress-Archive -Path dist/Kairo -DestinationPath $zipYol -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipYol).Hash
          "$hash  $zipAd" | Out-File -Encoding ascii dist/SHA256.txt
      - name: GitHub Release yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = (Get-Item dist/Kairo-*-windows-portable.zip | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $zip dist/SHA256.txt --generate-notes
