[project]
name = "kairo"
version = "0.1.0"
description = "Yerel (llama.cpp) sansursuz modelleri sohbet, OCR, arac ve karsilastirma testleriyle deneme uygulamasi"
requires-python = ">=3.12"
authors = [{ name = "Umut Çelik" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# gorev metinleri ve fixture icerikleri veri: bolunmeleri okunurlugu bozar
"degerlendirme/gorevler.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["canli: yerel llama-server acikken calisan kisa canli test"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
