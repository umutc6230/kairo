# Yeniden kullanilabilir Kairo ajan Action'i: baska bir depodan
# -P: calisilan depoda kendi "app" paketi olsa da Kairo kodu yalniz action_path'ten yuklenir.
#   - uses: umutc6230/kairo@main
#     with: { hedef: "testleri gecir", openrouter-api-key: "${{ secrets.OPENROUTER_API_KEY }}" }
# Ayni guvenlik kurallari (.github/workflows/ajan.yml): degisiklik push edilmez/PR acilmaz,
# "onayli" modda onay gereken adimda kod 3 ile durur (CI'da gozetimsiz onay YOK); sonuc ve diff
# `rapor-klasoru` altina yazilir. Hedefi issue/PR metninden otomatik doldurmayin (prompt injection).
name: Kairo ajan
description: Kairo'nun headless ajanini calisan depoda bir hedefle calistirir (OpenRouter modeli).
inputs:
  hedef:
    description: Gorev hedefi
    required: true
  openrouter-api-key:
    description: OpenRouter API anahtari (secrets ile verin)
    required: true
  model:
    description: OpenRouter modeli
    default: openai/gpt-oss-20b:free
  mod:
    description: onayli | otomatik
    default: onayli
  kabul:
    description: Kabul kosulu (bos = yok)
    default: ""
  proje:
    description: Ajanin calisacagi klasor
    default: ${{ github.workspace }}
  rapor-klasoru:
    description: olaylar.jsonl ve degisiklik.diff buraya yazilir
    default: ${{ runner.temp }}/kairo-rapor
outputs:
  cikis-kodu:
    description: 0 basarili | 1 basarisiz | 2 dogrulanmadi | 3 onay bekliyor | 4 hata
    value: ${{ steps.ajan.outputs.cikis_kodu }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Kairo kur
      shell: pwsh
      run: python -m pip install -q -r "${{ github.action_path }}/requirements.txt"
    - name: Ajan
      id: ajan
      shell: pwsh
      env:
        PYTHONPATH: ${{ github.action_path }}
        YAS_VERI_DIZINI: ${{ runner.temp }}/kairo-veri
        YAS_OPENROUTER_ANAHTARI: ${{ inputs.openrouter-api-key }}
        HEDEF: ${{ inputs.hedef }}
        MODEL: ${{ inputs.model }}
        MOD: ${{ inputs.mod }}
        KABUL: ${{ inputs.kabul }}
        PROJE: ${{ inputs.proje }}
        RAPOR: ${{ inputs.rapor-klasoru }}
      run: |
        New-Item -ItemType Directory -Force $env:RAPOR | Out-Null
        $ek = @()
        if ($env:KABUL) { $ek += @("--kabul", $env:KABUL) }
        python -P -m app agent "$env:HEDEF" --proje "$env:PROJE" --guven guvenilir --mod "$env:MOD" `
          --openrouter-model "$env:MODEL" --json @ek | Tee-Object "$env:RAPOR/olaylar.jsonl"
        $kod = $LASTEXITCODE
        git -C "$env:PROJE" diff | Out-File -Encoding utf8 "$env:RAPOR/degisiklik.diff"
        "cikis_kodu=$kod" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        exit $kod
